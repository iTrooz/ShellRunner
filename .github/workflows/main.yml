name: SSH shell

permissions:
  id-token: write

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner'
        required: true
        type: choice
        options:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        - windows-11-arm
        - ubuntu-24.04-arm
      container:
        description: 'container'
        required: false
        type: string
      command:
        description: 'command to run instead of an SSH shell'
        required: false
        type: string

jobs:
  simple-runner:
    name: Normal runner
    if: ${{ ! inputs.container }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    
    steps:
      - name: Run command
        if : ${{ inputs.command }}
        run: ${{ inputs.command }}

      - uses: owenthereal/action-upterm@v1
        if : ${{ ! inputs.command }}
        name: Setup upterm

  runner-with-container:
    name: Runner with container
    if: ${{ inputs.container }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}

    container:
      image: ${{ inputs.container }}
    
    steps:
      - name: Run command
        if : ${{ inputs.command }}
        run: ${{ inputs.command }}

      - name: Setup upterm 
        if : ${{ ! inputs.command }}
        uses: owenthereal/action-upterm@v1